
services:
  postgres:
    image: postgres:16
    container_name: cloudguard-postgres
    environment:
      POSTGRES_DB: cloudguard
      POSTGRES_USER: cloudguard
      POSTGRES_PASSWORD: cloudguard_dev_password
    ports:
      - "5432:5432"
    volumes:
      - cloudguard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudguard -d cloudguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./Backend
    image: cloudguard-api:1.0
    container_name: cloudguard-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://cloudguard:cloudguard_dev_password@postgres:5432/cloudguard
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cloudguard_postgres_data:
    name: cloudguardwebapp_cloudguard_postgres_data
    external: true
