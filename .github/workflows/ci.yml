
name: CloudGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cloudguard_test
          POSTGRES_USER: cloudguard
          POSTGRES_PASSWORD: cloudguard_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudguard -d cloudguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: Backend

    env:
      DATABASE_URL: postgresql+psycopg://cloudguard:cloudguard_test_password@localhost:5432/cloudguard_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

        
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CloudGuard API image
        run: docker build -t cloudguard-api:${{ github.sha }} ./Backend
